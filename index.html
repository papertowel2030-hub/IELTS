<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BandUp — IELTS® Exam Prep</title>
<meta name="description" content="ADHD-friendly IELTS prep for Academic & General. Band 6.5–8. Techniques, practice, and a plan that never overwhelms you.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <div>
    <header class="appbar" id="appbar"></header>
    <main class="main">
      <div class="main-inner" id="home"></div>
    </main>
  </div>
</div>

<script src="app.js"></script>
<script>
/* ---- Home: onboarding wizard OR dashboard --------------------------- */
(function () {
  var root = document.getElementById("home");
  var S = IELTS.state();

  function h(html){ var d=document.createElement("div"); d.innerHTML=html; return d; }
  function band(n){ return Number(n).toFixed(1).replace(/\.0$/, ".0"); }

  /* ============ ONBOARDING ============ */
  function onboarding() {
    root.innerHTML =
      '<div class="hero">' +
        '<span class="eyebrow">Welcome — 60 seconds to set up</span>' +
        '<h1>Let\'s build your plan.</h1>' +
        '<p class="lead">Answer 3 quick things. You can change any of them later. No sign-up, nothing to install — your progress saves on this device.</p>' +
      '</div>' +

      '<div class="card">' +
        '<h3 class="mt0">1 · Which test are you taking?</h3>' +
        '<div class="btn-row" id="ob-track">' +
          '<button class="btn ghost" data-v="general">🌍 General Training<br><small class="muted">Immigration, work, migration</small></button>' +
          '<button class="btn ghost" data-v="academic">🎓 Academic<br><small class="muted">University, professional registration</small></button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<h3 class="mt0">2 · What band do you need?</h3>' +
        '<p class="muted mt0">Pick your overall target. Aim 0.5 above the minimum you were told, for safety.</p>' +
        '<div class="btn-row" id="ob-target">' +
          '<button class="btn ghost" data-v="6.5">6.5</button>' +
          '<button class="btn ghost" data-v="7">7.0</button>' +
          '<button class="btn ghost" data-v="7.5">7.5</button>' +
          '<button class="btn ghost" data-v="8">8.0</button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<h3 class="mt0">3 · Roughly where are you now?</h3>' +
        '<p class="muted mt0">A quick honest guess for each skill. Not sure? Pick “New to this”. You\'ll get a real score from the full mock later.</p>' +
        '<div id="ob-skills"></div>' +
      '</div>' +

      '<div class="btn-row"><button class="btn primary big" id="ob-go" disabled>Build my plan →</button></div>';

    var picked = { track: null, target: null, diag: {} };

    root.querySelectorAll("#ob-track button").forEach(function (b) {
      b.addEventListener("click", function () {
        picked.track = b.dataset.v;
        root.querySelectorAll("#ob-track button").forEach(function (x){ x.classList.toggle("primary", x===b); x.classList.toggle("ghost", x!==b); });
        IELTS.setTrack(picked.track);
        checkReady();
      });
    });
    root.querySelectorAll("#ob-target button").forEach(function (b) {
      b.addEventListener("click", function () {
        picked.target = parseFloat(b.dataset.v);
        root.querySelectorAll("#ob-target button").forEach(function (x){ x.classList.toggle("primary", x===b); x.classList.toggle("ghost", x!==b); });
        checkReady();
      });
    });

    var levels = [["","New to this"],["5.5","~5.5"],["6","~6.0"],["6.5","~6.5"],["7","~7.0"],["7.5","~7.5+"]];
    var skillNames = { listening:"🎧 Listening", reading:"📖 Reading", writing:"✍️ Writing", speaking:"🗣️ Speaking" };
    var sk = root.querySelector("#ob-skills");
    IELTS.skills.forEach(function (s) {
      var row = document.createElement("div");
      row.className = "field-row";
      row.style.gridTemplateColumns = "130px 1fr";
      row.style.alignItems = "center";
      var opts = levels.map(function(l){ return '<option value="'+l[0]+'">'+l[1]+'</option>'; }).join("");
      row.innerHTML = '<label class="field" style="margin:.4rem 0" for="ob-'+s+'">'+skillNames[s]+'</label><select id="ob-'+s+'" name="'+s+'" data-skill="'+s+'">'+opts+'</select>';
      sk.appendChild(row);
    });
    sk.querySelectorAll("select").forEach(function (sel) {
      sel.addEventListener("change", function () {
        if (sel.value) picked.diag[sel.dataset.skill] = parseFloat(sel.value);
        else delete picked.diag[sel.dataset.skill];
      });
    });

    function checkReady() {
      root.querySelector("#ob-go").disabled = !(picked.track && picked.target);
    }
    root.querySelector("#ob-go").addEventListener("click", function () {
      S.track = picked.track;
      S.targetBand = picked.target;
      S.diagnostic = picked.diag;
      S.setup = true;
      IELTS.save();
      IELTS.refreshChrome();
      dashboard();
      window.scrollTo({ top: 0, behavior: "smooth" });
      IELTS.toast("Plan ready — let's go 🚀");
    });
  }

  /* ============ DASHBOARD ============ */
  function nextAction() {
    // biggest-gap skill that still has incomplete lessons
    var best = null;
    IELTS.skills.forEach(function (s) {
      var pr = IELTS.skillProgress(s);
      var cur = S.diagnostic[s];
      var gap = (cur != null && S.targetBand != null) ? (S.targetBand - cur) : 0.5;
      var incomplete = !pr.total || pr.done < pr.total;
      var score = gap * 10 + (incomplete ? 5 : -100) - (pr.total ? pr.done : 0) * 0.1;
      if (incomplete && (!best || score > best.score)) best = { skill: s, score: score, pr: pr, gap: gap };
    });
    if (best) {
      var nm = best.skill.charAt(0).toUpperCase() + best.skill.slice(1);
      var reason = best.gap >= 1 ? "This is your biggest gap to target — worth the focus." : "Keep the momentum going with a steady next step.";
      var lessons = best.pr.total ? (" You're on lesson " + (best.pr.done + 1) + " of " + best.pr.total + ".") : "";
      return { title: "Continue " + nm, sub: reason + lessons, href: best.skill + ".html", cta: "Open " + nm + " →" };
    }
    return { title: "Take a full timed mock", sub: "You\'ve worked through the lessons — now test under real conditions and log every error.", href: "diagnostic.html", cta: "Diagnostic protocol →" };
  }

  function dashboard() {
    var target = S.targetBand;
    var na = nextAction();
    var errCount = (S.errorLog || []).length;

    var html =
      '<div class="hero">' +
        '<span class="eyebrow">' + (IELTS.track()==="academic"?"Academic":"General Training") + ' · Target Band ' + band(target) + '</span>' +
        '<h1>Your plan</h1>' +
        '<p class="lead">One thing at a time. Do the next action, log what you miss, come back tomorrow.</p>' +
      '</div>' +

      '<div class="next-action">' +
        '<span class="eyebrow">▶ Do this next</span>' +
        '<h2>' + na.title + '</h2>' +
        '<p class="mt0">' + na.sub + '</p>' +
        '<a class="btn primary big" href="' + na.href + '">' + na.cta + '</a>' +
      '</div>' +

      '<div class="stat-grid">' +
        stat(band(target), "Target band") +
        stat((S.streak.count?("🔥 "+S.streak.count):"0"), "Day streak") +
        stat(IELTS.overallLessonsDone(), "Lessons done") +
        stat(errCount, "Errors logged") +
      '</div>' +

      '<h2>Your four skills</h2>' +
      '<div class="skill-grid" id="dash-skills"></div>' +

      '<h2>Jump to a tool</h2>' +
      '<div class="skill-grid">' +
        tool("study-plan.html","🗓️","Study Plan","Your interleaved week") +
        tool("error-log.html","📋","Error Log","Turn mistakes into gains") +
        tool("flashcards.html","🔁","Flashcards","Spaced-repetition vocab") +
        tool("timer.html","⏱️","Focus Timer","25-min focus blocks") +
      '</div>' +

      '<div class="pagenav"><a href="foundations.html">🧭 Start with Foundations</a>' +
      '<a href="#" id="redo">Redo setup</a></div>';

    root.innerHTML = html;

    var sg = root.querySelector("#dash-skills");
    var meta = { listening:["🎧","Listening"], reading:["📖","Reading"], writing:["✍️","Writing"], speaking:["🗣️","Speaking"] };
    IELTS.skills.forEach(function (s) {
      var pr = IELTS.skillProgress(s);
      var cur = S.diagnostic[s];
      var a = document.createElement("a");
      a.className = "skill-card"; a.href = s + ".html";
      a.innerHTML =
        '<span class="ico">'+meta[s][0]+'</span>' +
        '<strong>'+meta[s][1]+'</strong>' +
        '<span>'+(cur!=null?("Now ~"+band(cur)+" → "):"")+"Target "+band(target)+'</span>' +
        '<div class="progress"><span style="width:'+pr.pct+'%"></span></div>' +
        '<span>'+(pr.total?(pr.done+"/"+pr.total+" lessons"):"Start here")+'</span>';
      sg.appendChild(a);
    });
    root.querySelector("#redo").addEventListener("click", function (e) {
      e.preventDefault();
      if (confirm("Restart setup? Your lessons/progress stay saved — only test type, target and starting levels reset.")) onboarding();
    });
  }

  function stat(num, lbl){ return '<div class="stat"><div class="num">'+num+'</div><div class="lbl">'+lbl+'</div></div>'; }
  function tool(href,ico,t,sub){ return '<a class="skill-card" href="'+href+'"><span class="ico">'+ico+'</span><strong>'+t+'</strong><span>'+sub+'</span></a>'; }

  /* boot */
  if (S.setup) dashboard(); else onboarding();
})();
</script>
</body>
</html>
